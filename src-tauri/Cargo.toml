[package]
name = "arkonad"
version = "0.1.0"
description = "The terminal app store and runtime for terminal software."
authors = ["Arkonad"]
edition = "2021"
rust-version = "1.88"
build = "build.rs"
default-run = "arkonad"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-clipboard-manager", "dep:portable-pty"]

[[bin]]
name = "arkonad-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
portable-pty = { version = "0.9.0", optional = true }
ratatui = { version = "=0.29.0", features = ["unstable-rendered-line-info"] }
crossterm = "=0.28.1"
dirs = "6"
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.4", features = [], optional = true }
tauri-plugin-clipboard-manager = { version = "2.3.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
