name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-contract:
    name: Release contract and Rust tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release contract
        run: pnpm run test:release

      - name: Build frontend
        run: pnpm run build

      - name: Run Rust release tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture

  windows-bundle:
    name: Build and sign Windows installers
    needs: release-contract
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Require Windows signing credentials
        shell: powershell
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CERTIFICATE_BASE64 is required for a signed release."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required for a signed release."
          }

      - name: Decode signing certificate
        shell: powershell
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "arkonad-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          "ARKONAD_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows bundles
        run: pnpm exec tauri build

      - name: Sign and verify Windows bundles
        shell: powershell
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signTool = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe `
            -Recurse `
            -File | Sort-Object FullName | Select-Object -Last 1
          if ($null -eq $signTool) {
            throw "signtool.exe was not found on the Windows runner."
          }

          $artifacts = Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") }
          if ($artifacts.Count -lt 2) {
            throw "Both NSIS and MSI release artifacts are required."
          }

          foreach ($artifact in $artifacts) {
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $env:ARKONAD_CERTIFICATE_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD $artifact.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($artifact.FullName)."
            }
          }

      - name: Verify signed bundle contract
        shell: powershell
        run: .\scripts\verify-windows-release.ps1 -BundleRoot .\src-tauri\target\release\bundle -RequireSignature

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: arkonad-windows-installers
          path: src-tauri/target/release/bundle/**/*.{exe,msi}
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes
          Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") } |
            ForEach-Object { gh release upload $env:GITHUB_REF_NAME $_.FullName --clobber }
